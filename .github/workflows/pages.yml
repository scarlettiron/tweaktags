name: Deploy docs to GitHub Pages

# Publishes the static site in docs/ whenever it changes on the default branch.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # The live demo runs the real browser build, so a change to the vanilla
      # package or the demo backend has to redeploy the site too.
      - 'packages/vanillajs/**'
      - 'packages/browser/**'
      - 'examples/vanilla-demo/mock-api.js'
      - '.github/workflows/pages.yml'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# The permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, and let an in progress one finish.
# Two overlapping deployments are a common cause of "Deployment failed".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The demo page at /demo runs the real browser build against a small in
      # memory backend, so there is nothing to keep in sync by hand: both files
      # are copied in from the source of truth on every deploy.
      - name: Build the browser bundle for the live demo
        run: pnpm --filter @tweaktags/vanillajs build

      - name: Copy the demo assets into the site
        run: |
          cp packages/vanillajs/dist/index.global.js docs/demo/tweaktags.global.js
          cp examples/vanilla-demo/mock-api.js docs/demo/mock-api.js
          ls -la docs/demo

      - name: Upload the docs folder as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
